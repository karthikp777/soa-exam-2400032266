spring.application.name=APIGateway

server.port=9000

eureka.instance.appname=api-gateway-service
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8001
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/user/**

spring.cloud.gateway.server.webmvc.routes[1].id=product-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8002
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/product/**
